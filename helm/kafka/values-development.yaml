# Development specific values
kafka:
  broker:
    replicaCount: 2
    persistence:
      enabled: false
  controller:
    replicaCount: 1
    persistence:
      enabled: false
    livenessProbe:
      initialDelaySeconds: 120

  # Enable external access via NodePort
  external:
    enabled: true
    service:
      type: NodePort
      nodePorts:
        - 32092
        - 32093

  # Adjusted resource requests/limits for stability
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi

# Kafka UI settings for Development
kafka-ui:
  envVars:
    - name: KAFKA_CLUSTERS_0_NAME
      value: "Development Kafka"
  service:
    type: NodePort
    nodePort: 30000
